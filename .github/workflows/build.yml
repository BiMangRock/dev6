# GitHub Actions 자동 빌드
# - 어느 브랜치든 push하면 GitHub 서버가 `gradlew build`를 실행합니다.
# - 결과: 저장소의 Actions 탭에서 ✅/❌ 확인. 실패하면 로그에서 오류 파일·줄 번호를 볼 수 있습니다.
# - 성공하면 빌드된 jar를 Actions 실행 화면 아래 "Artifacts"에서 내려받을 수 있습니다.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: jar 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ github.run_number }}   # 브랜치 이름의 "/"는 artifact 이름에 쓸 수 없어 실행 번호 사용
          path: build/libs/*.jar
